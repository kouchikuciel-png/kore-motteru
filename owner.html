<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>本を登録する</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f5; color:#111; }
    main { width:min(100%,620px); margin:0 auto; min-height:100dvh; padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom)); }
    h1 { margin:8px 0 6px; font-size:30px; }
    .sub,.note { color:#666; line-height:1.6; }
    .card { background:#fff; border-radius:20px; padding:18px; box-shadow:0 2px 14px rgba(0,0,0,.08); }
    #reader { position:relative; width:100%; overflow:hidden; border-radius:16px; }
    #reader video { border-radius:16px; }
    #reader.scan-rejected::after { content:""; position:absolute; z-index:9999; left:50%; top:50%; width:min(300px,calc(100% - 24px)); height:130px; transform:translate(-50%,-50%); border:7px solid #d93025; border-radius:8px; box-shadow:0 0 0 2px rgba(255,255,255,.72); pointer-events:none; }
    button { width:100%; border:0; border-radius:14px; padding:16px 18px; font-size:18px; font-weight:700; background:#111; color:#fff; cursor:pointer; }
    button.secondary { margin-top:12px; background:#ececec; color:#111; }
    button:disabled { opacity:.55; cursor:default; }
    .status { margin-top:16px; padding:18px; border-radius:16px; background:#f1f1f1; text-align:center; }
    .status strong { display:block; font-size:22px; margin-bottom:8px; }
    .barcode { margin-top:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#666; word-break:break-all; }
    .ok { background:#e8f7ea; }
    .warn { background:#fff4d8; }
    .error { background:#fff0f0; }
    .hidden { display:none !important; }
    .ocr-help { margin-top:14px; padding:14px; border-radius:14px; background:#f3f3f3; color:#666; line-height:1.55; font-size:14px; }
    .quantity-panel { margin-top:16px; padding:16px; border-radius:16px; background:#f7f7f7; }
    .quantity-label { margin:0 0 12px; text-align:center; color:#555; font-weight:700; }
    .quantity-row { display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:16px; }
    button.quantity-button { width:58px; height:58px; padding:0; border-radius:50%; font-size:30px; line-height:1; }
    .quantity-value { min-width:72px; text-align:center; font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; }
    .quantity-value small { display:block; margin-top:2px; color:#777; font-size:13px; font-weight:600; }
    canvas { display:none; }
    @media (prefers-color-scheme: dark) {
      body { background:#0f0f0f; color:#fff; }
      .card { background:#181818; }
      .sub,.note,.barcode,.ocr-help,.quantity-label,.quantity-value small { color:#aaa; }
      .status,.ocr-help,.quantity-panel { background:#262626; }
      .ok { background:#17391f; }
      .warn { background:#443712; }
      .error { background:#3b1b1b; }
      button { background:#fff; color:#111; }
      button.secondary { background:#2d2d2d; color:#fff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>本を登録する</h1>
    <p class="sub">本のうらをカメラに向けてください。バーコードが見えるようにしてください。2つあっても、そのままで大丈夫です。</p>

    <section class="card">
      <button id="startBtn" type="button">カメラで登録する</button>
      <div id="reader" class="hidden"></div>

      <button id="ocrBtn" class="secondary hidden" type="button">うまく読めないとき</button>
      <div id="ocrHelp" class="ocr-help hidden">バーコードが見つからないときは、本のうらの数字が書かれているあたりを画面中央に大きく映してください。そのまま数秒待つと自動で読み取ります。</div>

      <div id="status" class="status">
        <strong>準備OK</strong>
        <span>カメラを起動してください。</span>
      </div>

      <div id="quantityPanel" class="quantity-panel hidden">
        <p id="quantityLabel" class="quantity-label">登録する数量</p>
        <div class="quantity-row" aria-label="数量を選ぶ">
          <button id="minusBtn" class="quantity-button" type="button" aria-label="数量を1減らす">−</button>
          <div class="quantity-value"><span id="qtyValue">1</span><small>個</small></div>
          <button id="plusBtn" class="quantity-button" type="button" aria-label="数量を1増やす">＋</button>
        </div>
        <button id="confirmBtn" type="button">登録する</button>
      </div>

      <button id="againBtn" class="secondary hidden" type="button">別のものを読み取る</button>
    </section>

    <p class="note">写真そのものは保存しません。本に印刷された番号の読み取りは端末上で行い、登録する番号と数量だけを送信します。</p>
    <canvas id="captureCanvas"></canvas>
  </main>
  <script src="./owner.js"></script>
  <script src="./owner-scan-feedback.js"></script>
</body>
</html>
