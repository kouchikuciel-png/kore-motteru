<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>これ持ってる？</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    main {
      width: min(100%, 560px);
      margin: 0 auto;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }
    h1 { margin: 8px 0 4px; font-size: 30px; }
    .sub { margin: 0 0 22px; color: #666; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
    }
    #reader { width: 100%; overflow: hidden; border-radius: 16px; }
    #reader video { border-radius: 16px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      background: #111;
      color: #fff;
    }
    button.secondary { margin-top: 12px; background: #ececec; color: #111; }
    .status { margin-top: 18px; padding: 18px; border-radius: 16px; background: #f1f1f1; text-align: center; }
    .status strong { display: block; font-size: 22px; margin-bottom: 8px; }
    .barcode { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; color: #555; word-break: break-all; }
    .ok { background: #e8f7ea; }
    .ng { background: #f3f3f3; }
    .error { background: #fff0f0; }
    .hidden { display: none !important; }
    .note { margin: 18px 4px 0; color: #666; font-size: 13px; line-height: 1.6; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; color: #fff; }
      .card { background: #181818; }
      .sub, .note, .barcode { color: #aaa; }
      .status, .ng { background: #262626; }
      .ok { background: #17391f; }
      .error { background: #3b1b1b; }
      button { background: #fff; color: #111; }
      button.secondary { background: #2d2d2d; color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>これ持ってる？</h1>
    <p class="sub">バーコードを向けるだけで確認します。</p>

    <section class="card">
      <button id="startBtn">バーコードを確認する</button>
      <div id="reader" class="hidden"></div>

      <div id="status" class="status">
        <strong>準備OK</strong>
        <span>ボタンを押してカメラを起動してください。</span>
      </div>

      <button id="againBtn" class="secondary hidden">もう一度確認する</button>
    </section>

    <p class="note">写真は保存しません。読み取ったバーコード番号だけを照合します。</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
