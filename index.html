<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>これ持ってる？</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    main {
      width: min(100%, 620px);
      margin: 0 auto;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }
    h1 { margin: 8px 0 4px; font-size: 30px; }
    h2 { margin: 0; font-size: 22px; }
    .sub { margin: 0 0 22px; color: #666; line-height: 1.55; }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 2px 14px rgba(0,0,0,.08);
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .toolbar button { width: auto; }
    #reader { width: 100%; overflow: hidden; border-radius: 16px; }
    #reader video { border-radius: 16px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
    button.secondary { margin-top: 12px; background: #ececec; color: #111; }
    button.small {
      width: 52px;
      height: 52px;
      padding: 0;
      border-radius: 14px;
      font-size: 26px;
    }
    button.back {
      width: auto;
      padding: 10px 14px;
      font-size: 15px;
      background: #ececec;
      color: #111;
    }
    .status {
      margin-top: 18px;
      padding: 18px;
      border-radius: 16px;
      background: #f1f1f1;
      text-align: center;
    }
    .status strong { display: block; font-size: 22px; margin-bottom: 8px; }
    .barcode {
      margin-top: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      color: #555;
      word-break: break-all;
    }
    .ok { background: #e8f7ea; }
    .warn { background: #fff4d8; }
    .ng { background: #f3f3f3; }
    .error { background: #fff0f0; }
    .hidden { display: none !important; }
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .state-item {
      border-radius: 14px;
      background: #f3f3f3;
      padding: 14px 10px;
      text-align: center;
    }
    .state-item span { display: block; color: #666; font-size: 13px; }
    .state-item strong { display: block; margin-top: 4px; font-size: 28px; }
    .qty-label { margin: 16px 0 8px; text-align: center; color: #666; font-size: 14px; }
    .qty-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
    }
    #qtyValue { min-width: 42px; text-align: center; font-size: 26px; font-weight: 800; }
    .owned-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 2px 2px 12px;
    }
    .owned-count { color: #666; font-size: 14px; }
    .owned-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .owned-item {
      overflow: hidden;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
      min-width: 0;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }
    .owned-item:active { transform: scale(.985); opacity: .88; }
    .owned-item:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    .owned-cover {
      aspect-ratio: 3 / 4;
      width: 100%;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      overflow: hidden;
    }
    .owned-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .owned-body { padding: 12px; }
    .owned-title {
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }
    .owned-author, .owned-meta {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .empty {
      padding: 28px 18px;
      border-radius: 16px;
      background: #f1f1f1;
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }
    .detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,.72);
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .detail-sheet {
      width: min(100%, 560px);
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
    }
    .detail-cover {
      width: 130px;
      aspect-ratio: 3/4;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: #e9e9e9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
    .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detail-title { font-size: 22px; font-weight: 800; text-align: center; line-height: 1.4; }
    .detail-author { margin-top: 6px; color: #666; text-align: center; }
    .detail-meta { margin: 12px 0 16px; color: #666; text-align: center; font-size: 13px; line-height: 1.6; }
    .note { margin: 18px 4px 0; color: #666; font-size: 13px; line-height: 1.6; }
    @media (min-width: 520px) {
      .owned-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; color: #fff; }
      .card, .owned-item, .detail-sheet { background: #181818; }
      .sub, .note, .barcode, .qty-label, .owned-count, .owned-author, .owned-meta, .detail-author, .detail-meta { color: #aaa; }
      .status, .ng, .state-item, .empty { background: #262626; }
      .state-item span { color: #aaa; }
      .owned-cover, .detail-cover { background: #242424; }
      .ok { background: #17391f; }
      .warn { background: #443712; }
      .error { background: #3b1b1b; }
      button { background: #fff; color: #111; }
      button.secondary, button.back { background: #2d2d2d; color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <section id="ownedView">
      <h1>持ってるもの</h1>
      <p class="sub">まずは家にあるものを見てから、プレゼントを選べます。</p>

      <div class="owned-head">
        <h2>登録済み</h2>
        <span id="ownedCount" class="owned-count"></span>
      </div>
      <div id="ownedLoading" class="empty">持ってるものを読み込み中…</div>
      <div id="ownedList" class="owned-list hidden"></div>
      <div id="ownedEmpty" class="empty hidden">まだ登録されているものはありません。</div>
      <div id="ownedError" class="empty hidden">一覧を読み込めませんでした。共有リンクを確認してください。</div>

      <button id="scanNavBtn" type="button">バーコードで確認する</button>
      <p class="note">一覧にない商品でも、バーコードを読めば所有・購入予定の重複を確認できます。</p>
    </section>

    <section id="scanView" class="hidden">
      <div class="toolbar">
        <button id="backBtn" class="back" type="button">← 持ってるもの</button>
      </div>
      <h1>これ持ってる？</h1>
      <p class="sub">バーコードを向けるだけで、家の状態を確認します。</p>

      <section class="card">
        <button id="startBtn">バーコードを確認する</button>
        <div id="reader" class="hidden"></div>

        <div id="status" class="status">
          <strong>準備OK</strong>
          <span>ボタンを押してカメラを起動してください。</span>
        </div>

        <div id="purchasePanel" class="hidden">
          <div class="state-grid">
            <div class="state-item">
              <span>すでに持っている</span>
              <strong id="ownedQty">0</strong>
            </div>
            <div class="state-item">
              <span>購入予定</span>
              <strong id="plannedQty">0</strong>
            </div>
          </div>

          <div class="qty-label">今回の購入予定数量</div>
          <div class="qty-row">
            <button id="minusBtn" class="small secondary" type="button">−</button>
            <div id="qtyValue">1</div>
            <button id="plusBtn" class="small secondary" type="button">＋</button>
          </div>

          <button id="purchaseBtn" type="button">購入予定に入れる</button>
        </div>

        <button id="againBtn" class="secondary hidden">別の商品を確認する</button>
      </section>

      <p class="note">写真は保存しません。読み取ったバーコード番号と購入状態だけを共有します。</p>
    </section>
  </main>

  <div id="detailOverlay" class="detail-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="detail-sheet">
      <div id="detailCover" class="detail-cover"></div>
      <div id="detailTitle" class="detail-title"></div>
      <div id="detailAuthor" class="detail-author"></div>
      <div id="detailMeta" class="detail-meta"></div>
      <button id="detailCheckBtn" type="button">この商品を確認する</button>
      <button id="detailCloseBtn" class="secondary" type="button">閉じる</button>
    </div>
  </div>

  <script src="./book-metadata-adapter.js"></script>
  <script src="./app.js"></script>
</body>
</html>
